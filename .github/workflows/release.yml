# Builds the multi-arch image and publishes it to GHCR on every merge to main.
#
# Runs on the self-hosted runners (Mac mini or Beast, whichever is free) so the persistent
# BuildKit cache makes rebuilds take well under a minute. Only `push` to main (and manual dispatch by a
# maintainer) can reach these machines; pull requests never run here (see ci.yml).
name: Release image

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "LICENSE", "assets/**", ".github/workflows/ci.yml"]
  workflow_dispatch:

# A newer merge supersedes an in-progress build.
concurrency:
  group: release-main
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/listaculous/listaculous
  PLATFORMS: linux/amd64,linux/arm64

jobs:
  build:
    # Manual runs can pick any branch; only main may publish the production tags.
    if: github.ref == 'refs/heads/main'
    # Any idle self-hosted Listaculous runner (the Mac mini or Beast).
    runs-on: [self-hosted, listaculous]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: CI Docker config
        run: |
          # A dedicated Docker config without a credential helper: Docker Desktop's macOS Keychain
          # helper can't be used from a background service ("User interaction is not allowed"). It also keeps the builder list
          # separate from the machine owner's. Plugins (buildx) are linked in from the usual place.
          dir="$HOME/.docker-listaculous-ci"
          mkdir -p "$dir"
          [ -f "$dir/config.json" ] || echo '{}' > "$dir/config.json"
          if [ -d "$HOME/.docker/cli-plugins" ] && [ ! -e "$dir/cli-plugins" ]; then
            ln -s "$HOME/.docker/cli-plugins" "$dir/cli-plugins"
          fi
          echo "DOCKER_CONFIG=$dir" >> "$GITHUB_ENV"
          # With no credsStore set, Docker on macOS still defaults to docker-credential-osxkeychain
          # if it's on PATH (Docker Desktop puts it next to `docker`), and the Keychain can't be
          # used from a service. So later steps get a PATH with `docker` but no credential helpers.
          mkdir -p "$dir/bin"
          ln -sf "$(command -v docker)" "$dir/bin/docker"
          echo "PATH=$dir/bin:/usr/bin:/bin:/usr/sbin:/sbin" >> "$GITHUB_ENV"

      - name: Persistent builder
        run: |
          # Keep one long-lived builder so BuildKit cache mounts (cargo registry, target dirs,
          # npm) survive between runs; recreate it only if it's missing or broken.
          if ! docker buildx inspect listaculous-ci --bootstrap >/dev/null 2>&1; then
            docker buildx rm listaculous-ci >/dev/null 2>&1 || true
            docker buildx create --name listaculous-ci --driver docker-container \
              --buildkitd-config .github/buildkit/buildkitd.toml --bootstrap
          fi

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Tags
        id: meta
        run: |
          # Calendar version from the build start time (UTC): YYYY.MM.DD.HHMM. Releases run one at a
          # time; if the previous one published in this same minute, wait for the next minute.
          # Cargo.toml's version isn't used for images.
          version=$(date -u +%Y.%m.%d.%H%M)
          while docker buildx imagetools inspect "$IMAGE:$version" >/dev/null 2>&1; do
            echo "$IMAGE:$version already exists; waiting for the next minute"
            sleep $((60 - $(date -u +%-S) + 1))
            version=$(date -u +%Y.%m.%d.%H%M)
          done
          short=${GITHUB_SHA::7}
          {
            echo "version=$version"
            echo "tags=-t $IMAGE:latest -t $IMAGE:main -t $IMAGE:sha-$short -t $IMAGE:$version"
            echo "smoke=$IMAGE:smoke-$short"
          } >> "$GITHUB_OUTPUT"

      - name: Build and smoke-test (native arch)
        run: |
          # Uses the same cache as the release build, so this adds only seconds.
          docker buildx build --builder listaculous-ci --load -t "${{ steps.meta.outputs.smoke }}" \
            --build-arg LISTACULOUS_VERSION=${{ steps.meta.outputs.version }} .
          cid=$(docker run -d --rm -e BASE_URL=http://localhost "${{ steps.meta.outputs.smoke }}")
          trap 'docker rm -f "$cid" >/dev/null 2>&1; docker rmi "${{ steps.meta.outputs.smoke }}" >/dev/null 2>&1' EXIT
          for _ in $(seq 1 20); do
            if docker exec "$cid" wget -qO- http://127.0.0.1:8080/api/auth/status 2>/dev/null \
                | grep -qF '"version":"${{ steps.meta.outputs.version }}"'; then
              echo "up, version ${{ steps.meta.outputs.version }}"; exit 0
            fi
            sleep 0.5
          done
          docker logs "$cid"; echo "smoke test failed" >&2; exit 1

      - name: Build and push (amd64 + arm64)
        run: |
          docker buildx build --builder listaculous-ci --platform "$PLATFORMS" --push \
            ${{ steps.meta.outputs.tags }} \
            --build-arg LISTACULOUS_VERSION=${{ steps.meta.outputs.version }} \
            --label org.opencontainers.image.revision=${{ github.sha }} \
            --label org.opencontainers.image.version=${{ steps.meta.outputs.version }} \
            .

      - name: Log out of GHCR
        if: always()
        run: docker logout ghcr.io >/dev/null 2>&1 || true

      - name: Summary
        run: |
          {
            echo "### Published \`$IMAGE\`"
            echo "Tags: \`latest\`, \`main\`, \`${{ steps.meta.outputs.version }}\`, \`sha-${GITHUB_SHA::7}\` (linux/amd64, linux/arm64)"
            echo "Built on: \`${RUNNER_NAME}\`"
          } >> "$GITHUB_STEP_SUMMARY"
